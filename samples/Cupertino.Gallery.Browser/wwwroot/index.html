<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Explore Cupertino.Avalonia controls and samples in your browser.">
  <title>Cupertino.Avalonia Gallery</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css">
  <!-- Keep the startup overlay visible even if the shared stylesheet is cached. -->
  <style>#loading { position: fixed; inset: 0; z-index: 1; }</style>
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
</head>
<body>
  <main id="out" aria-label="Cupertino gallery" aria-busy="true"></main>
  <div id="loading" class="splash" role="status" aria-live="polite">
    <div class="app-icon" aria-hidden="true">C</div>
    <div class="splash-copy">
      <strong id="loading-title">Cupertino.Avalonia</strong>
      <span id="loading-message">Loading the gallery…</span>
      <button id="reload-gallery" type="button" hidden>Reload gallery</button>
    </div>
  </div>
  <noscript>This gallery needs JavaScript and WebAssembly enabled.</noscript>
  <script type="module" src="main#[.{fingerprint}].js"></script>
</body>
</html>
