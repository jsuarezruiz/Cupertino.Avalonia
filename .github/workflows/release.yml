name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set package version
        shell: bash
        run: |
          package_version="${GITHUB_REF_NAME#v}"
          test -n "$package_version"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          dotnet build --configuration Release -p:Version="$PACKAGE_VERSION"
          dotnet test --no-build --configuration Release --verbosity minimal -p:Version="$PACKAGE_VERSION"

      - name: Pack
        run: dotnet pack src/Cupertino.Avalonia/Cupertino.Avalonia.csproj --no-build --configuration Release --output artifacts -p:Version="$PACKAGE_VERSION"

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
