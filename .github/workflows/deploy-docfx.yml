name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "samples/**"
      - "src/Cupertino.Avalonia/**"
      - "images/**"
      - "Directory.Build.props"
      - ".github/workflows/deploy-docfx.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install DocFX
        run: dotnet tool install --global docfx --version 2.78.4

      - name: Build documentation
        run: docfx docs/docfx.json --warningsAsErrors

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Publish browser gallery
        run: dotnet publish samples/Cupertino.Gallery.Browser/Cupertino.Gallery.Browser.csproj --configuration Release --verbosity minimal

      - name: Add gallery to documentation site
        run: |
          mkdir -p docs/_site/gallery
          cp -R samples/Cupertino.Gallery.Browser/bin/Release/net10.0-browser/publish/wwwroot/. docs/_site/gallery/

      - name: Disable Jekyll processing
        run: touch docs/_site/.nojekyll

      - name: Publish documentation and gallery
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
          GIT_SSH_COMMAND: ssh -i "${{ runner.temp }}/cupertino-site-deploy-key" -o IdentitiesOnly=yes -o UserKnownHostsFile="${{ runner.temp }}/cupertino-site-known-hosts"
        shell: bash
        run: |
          if [[ -z "$DEPLOY_KEY" ]]; then
            echo "The PAGES_DEPLOY_KEY repository secret is not configured." >&2
            exit 1
          fi

          printf '%s\n' "$DEPLOY_KEY" > "${{ runner.temp }}/cupertino-site-deploy-key"
          chmod 600 "${{ runner.temp }}/cupertino-site-deploy-key"
          ssh-keyscan github.com > "${{ runner.temp }}/cupertino-site-known-hosts"

          git -C docs/_site init
          git -C docs/_site checkout -b gh-pages
          git -C docs/_site add --all
          git -C docs/_site -c 'user.name=github-actions[bot]' -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' commit -m "Deploy $GITHUB_SHA"
          git -C docs/_site remote add origin git@github.com:jsuarezruiz/Cupertino.Avalonia.Site.git
          git -C docs/_site push --force origin gh-pages
