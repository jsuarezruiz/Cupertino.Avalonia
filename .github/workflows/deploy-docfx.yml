name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/Cupertino.Avalonia/**"
      - "images/**"
      - ".github/workflows/deploy-docfx.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install DocFX
        run: dotnet tool install --global docfx --version 2.78.4

      - name: Build documentation
        run: docfx docs/docfx.json --warningsAsErrors

      - name: Disable Jekyll processing
        run: touch docs/_site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
