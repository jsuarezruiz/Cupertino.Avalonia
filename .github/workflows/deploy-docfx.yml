name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "samples/**"
      - "src/Cupertino.Avalonia/**"
      - "images/**"
      - "Directory.Build.props"
      - ".github/workflows/deploy-docfx.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Self-heals if the Pages site is ever disabled in repo settings.
          enablement: true

      - name: Install DocFX
        run: dotnet tool install --global docfx --version 2.78.4

      - name: Publish documentation
        run: docfx docs/docfx.json --warningsAsErrors

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Publish browser gallery
        run: dotnet publish samples/Cupertino.Gallery.Browser/Cupertino.Gallery.Browser.csproj --configuration Release --verbosity minimal

      - name: Add gallery to documentation site
        run: |
          mkdir -p docs/_site/gallery
          cp -R samples/Cupertino.Gallery.Browser/bin/Release/net10.0-browser/publish/wwwroot/. docs/_site/gallery/

      - name: Disable Jekyll processing
        run: touch docs/_site/.nojekyll

      - name: Upload documentation and gallery
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
